<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="The Hive — Agent Activity Dashboard. Monitor your AI agents in real time." />
    <title>The Hive — Agent Dashboard</title>

    <!-- Prevent FOUC for neon theme -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('hive-theme');
          if (t === 'neon') document.documentElement.setAttribute('data-theme', 'neon');
        } catch (e) {}
      })();
    </script>

    <!-- Inter font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
